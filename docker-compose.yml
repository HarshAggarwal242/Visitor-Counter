# ---------------------------------------------------------------------------
# Local development stack: Flask + Redis on a private Compose network.
#
#   Browser -> localhost:8080 -> flask container -> redis:6379 (service name)
#
# Redis data lives in the named volume "redis-data", so the visit count
# survives "docker compose down" / restart.
# ---------------------------------------------------------------------------
name: visitor-counter

services:
  redis:
    image: redis:7-alpine
    container_name: visitor-counter-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    volumes:
      # Persistent storage: the counter is not lost when containers restart.
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - vcnet
    # Resource limits are optional locally but make CPU behaviour predictable
    # and mirror the Kubernetes requests/limits.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    image: visitor-counter:optimized
    container_name: visitor-counter-flask
    environment:
      # "redis" is the Compose service name, resolved by Docker's DNS.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      VISIT_COUNTER_KEY: visitor:total
      APP_PORT: "5000"
      APP_LOCATION: docker-compose-local
      POD_NAME: flask-container
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # host port 8080 -> container port 5000
      - "8080:5000"
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:5000/healthz", timeout=2).getcode()==200 else 1)']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - vcnet
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  redis-data:
    name: visitor-counter-redis-data

networks:
  vcnet:
    name: visitor-counter-net
    driver: bridge
